services:
  postgres:
    # pgvector-enabled Postgres (same instance as domain metadata)
    image: pgvector/pgvector:pg16
    container_name: vcs-postgres
    environment:
      POSTGRES_USER: vcs
      POSTGRES_PASSWORD: vcs
      POSTGRES_DB: vcs
    ports:
      - "5432:5432"
    volumes:
      - vcs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcs -d vcs"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vcs-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (built-in)
    environment:
      RABBITMQ_DEFAULT_USER: vcs
      RABBITMQ_DEFAULT_PASS: vcs
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Modern RabbitMQ dashboard (KafkaUI-like). Login with RabbitMQ creds (vcs/vcs).
  rabbitscout:
    image: ghcr.io/ralve-org/rabbitscout:latest
    container_name: vcs-rabbitscout
    ports:
      - "15673:3000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 15672
      RABBITMQ_PROTOCOL: http
      COOKIE_SECURE: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Free community MinIO (Chainguard). Official minio/minio Hub images are source-only now.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vcs-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vcs
      MINIO_ROOT_PASSWORD: vcschangeme
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - vcs_minio_data:/data
    restart: unless-stopped

volumes:
  vcs_postgres_data:
  vcs_minio_data:
